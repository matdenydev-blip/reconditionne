name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://root:@127.0.0.1:3306/reconditionne?serverVersion=8.4.7&charset=utf8mb4"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_mysql, ctype, iconv
          tools: composer

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Installer les assets JavaScript
        run: php bin/console importmap:install

      - name: Créer la base de test
        run: php bin/console doctrine:database:create --if-not-exists

      - name: Appliquer les migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Lancer les tests
        run: php bin/phpunit
